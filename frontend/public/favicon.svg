<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#12131f"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Main 'S' Gradient -->
    <linearGradient id="s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Emerald Glow Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Crisp Soft Glow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#27272a" stroke-width="3" opacity="0.6"/>

  <!-- Orbital Knowledge Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#s-grad)" stroke-width="2.5" opacity="0.2" stroke-dasharray="10 14"/>

  <!-- Geometric 'S' Monogram -->
  <path d="M 345 185
           C 345 130, 305 95, 256 95
           C 205 95, 165 130, 165 180
           C 165 240, 347 255, 347 325
           C 347 380, 305 417, 256 417
           C 205 417, 165 375, 165 320"
        fill="none"
        stroke="url(#s-grad)"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#soft-glow)"/>

  <!-- Synthis AI Sparkle / Citation Node at top terminal -->
  <g filter="url(#soft-glow)">
    <!-- 4-point AI Star at S-head -->
    <path d="M 345 140 Q 345 170 375 170 Q 345 170 345 200 Q 345 170 315 170 Q 345 170 345 140 Z" fill="url(#accent-grad)"/>
  </g>

  <!-- Terminal Nodes -->
  <!-- Top Start Node -->
  <circle cx="345" cy="185" r="16" fill="#ffffff" filter="url(#soft-glow)"/>
  <circle cx="345" cy="185" r="8" fill="#818cf8"/>

  <!-- Bottom End Node -->
  <circle cx="165" cy="320" r="16" fill="#ffffff" filter="url(#soft-glow)"/>
  <circle cx="165" cy="320" r="8" fill="#34d399"/>
</svg>