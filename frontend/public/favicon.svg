<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="50%" stop-color="#121320"/>
      <stop offset="100%" stop-color="#08090e"/>
    </linearGradient>

    <!-- Vibrant Brand Gradient for S Monogram -->
    <linearGradient id="s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Wide Unbounded Glow (x/y -100% to prevent box clipping artifacts) -->
    <filter id="clean-glow" x="-100%" y="-100%" width="300%" height="300%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#27272a" stroke-width="3" opacity="0.6"/>

  <!-- Orbital Orbit Accent Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring-grad)" stroke-width="2.5" stroke-dasharray="10 14"/>

  <!-- Smooth, Perfect Geometric 'S' Monogram -->
  <g filter="url(#clean-glow)">
    <path d="M 350 185
             C 350 125, 305 88, 256 88
             C 202 88, 162 125, 162 180
             C 162 248, 350 264, 350 332
             C 350 387, 310 424, 256 424
             C 202 424, 162 387, 162 327"
          fill="none"
          stroke="url(#s-grad)"
          stroke-width="52"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Clean Minimalist End Terminals (No green star, no square box clipping) -->
  <!-- Upper Terminal -->
  <circle cx="350" cy="185" r="16" fill="#ffffff"/>
  <circle cx="350" cy="185" r="8" fill="#818cf8"/>

  <!-- Lower Terminal -->
  <circle cx="162" cy="327" r="16" fill="#ffffff"/>
  <circle cx="162" cy="327" r="8" fill="#38bdf8"/>
</svg>