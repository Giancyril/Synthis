<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="50%" stop-color="#11121c"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>

    <!-- Brand Primary Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Subtle Outer Halo -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#brand-grad)" stroke-width="2" opacity="0.25" stroke-dasharray="8 12"/>

  <!-- Synthis "S" Ribbon & Neural Network Geometry -->
  <g filter="url(#glow)">
    <!-- Top Arc of 'S' -->
    <path d="M 340 180 C 340 130, 290 100, 240 100 C 180 100, 145 140, 145 190 C 145 260, 365 250, 365 325 C 365 375, 320 412, 256 412 C 195 412, 145 375, 145 330" 
          fill="none" 
          stroke="url(#brand-grad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Accent Emerald Sweep across central S diagonal -->
    <path d="M 230 220 L 290 280" 
          fill="none" 
          stroke="url(#emerald-grad)" 
          stroke-width="32" 
          stroke-linecap="round"/>
  </g>

  <!-- Connected Knowledge Nodes -->
  <!-- Top Right Node -->
  <circle cx="340" cy="180" r="14" fill="#fafafa" filter="url(#node-glow)"/>
  <circle cx="340" cy="180" r="7" fill="#818cf8"/>

  <!-- Center Core Node -->
  <circle cx="256" cy="256" r="16" fill="#34d399" filter="url(#node-glow)"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>

  <!-- Bottom Left Node -->
  <circle cx="145" cy="330" r="14" fill="#fafafa" filter="url(#node-glow)"/>
  <circle cx="145" cy="330" r="7" fill="#6366f1"/>

  <!-- Search / Citation Ray Accent -->
  <path d="M 330 330 L 390 390" stroke="url(#brand-grad)" stroke-width="18" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <circle cx="390" cy="390" r="10" fill="#34d399"/>
</svg>